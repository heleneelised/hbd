.back.read .letter{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) rotate(-.8deg)}
.back.read .env{pointer-events:none}
.flame,.rays{position:absolute;pointer-events:none}
.flame{left:45.37%;top:52.08%;width:8.89%;height:6.98%}
.flame img{width:100%;height:100%;display:block;transform-origin:50% 100%;transition:opacity .25s,filter .25s}
.flame{animation:flick 1.3s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.96,1.05)}}
.rays{left:38.33%;top:53.13%;width:23.15%;height:7.81%;transition:opacity .3s;animation:glow 1.3s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.out .flame{animation:none}.out .flame img{opacity:0;transform:scaleY(.15) !important}.out .rays{opacity:0;animation:none}
.smoke{position:absolute;left:49.5%;top:51%;width:2.2%;aspect-ratio:1;border-radius:50%;background:rgba(120,110,100,.45);filter:blur(3px);opacity:0;pointer-events:none}
.out .smoke{animation:puff 1.8s ease-out forwards}
@keyframes puff{0%{opacity:.7;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),-900%) scale(3)}}
.wish{position:absolute;left:0;right:0;top:11%;text-align:center;font:clamp(22px,calc(var(--pw)*.12),64px)/1 var(--hand);color:var(--red);opacity:0;transform:translateY(10px) rotate(-3deg);transition:opacity .6s .2s,transform .6s .2s;pointer-events:none}
.out .wish{opacity:1;transform:rotate(-3deg)}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .5s .5s}
body.is-open #bar{opacity:1;pointer-events:auto}
button.b{font:inherit;font-size:19px;background:var(--red);color:var(--cream);border:2px solid #8e2a2a;border-radius:6px 10px 7px 11px;padding:6px 16px;cursor:pointer;box-shadow:0 3px 0 #8e2a2a;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button.b:active,button.b.on{transform:translateY(2px);box-shadow:0 1px 0 #8e2a2a}
button.b.alt{background:var(--cream);color:var(--red)}
button[hidden]{display:none}
.meter{width:min(170px,34vw);height:14px;border:2px solid var(--ink);border-radius:8px;background:rgba(246,240,226,.8);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:var(--red)}
.meter u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
#status{flex-basis:100%;text-align:center;font-size:16px;min-height:20px}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){.book,.leaf,.letter{transition-duration:.01s}.flame,.rays{animation:none}}

$('thr').style.left=(BLOW_MIN/SCALE*100)+'%';
function openCard(){if(isOpen)return;isOpen=true;book.classList.add('open');document.body.classList.add('is-open');setTimeout(()=>{if(isOpen){startMic();loop(performance.now())}},900)}
function closeCard(){isOpen=false;book.classList.remove('open');document.body.classList.remove('is-open');lp.classList.remove('read');stopMic();cancelAnimationFrame(raf);relight()}
$('cover').onclick=openCard;$('back').onclick=closeCard;
$('env').onclick=()=>lp.classList.add('read');$('letter').onclick=()=>lp.classList.remove('read');
async function startMic(){
 if(stream)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext){say('Mic needs https. Hold the button or the space bar to blow.');return}
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);buf=new Float32Array(an.fftSize);
  $('mic').hidden=true;say('Mic is on. Blow at the candle, or hold the button.')}
 catch(e){stream=null;say('Mic is blocked. Hold the button or the space bar to blow.')}}
function stopMic(){if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close();stream=ctx=an=null;$('mic').hidden=false}
$('mic').onclick=startMic;
function micLevel(){if(!an)return 0;an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;const r=Math.sqrt(s/buf.length);
 if(r<amb*2+.01)amb+=(r-amb)*.02;return Math.max(0,r-amb)}
function loop(t){raf=requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||.016);last=t;
 manual+=((held?.85:0)-manual)*Math.min(1,dt*9);
 const raw=Math.max(micLevel()/SCALE,manual);level+=(raw-level)*Math.min(1,dt*14);
 $('lvl').style.width=Math.min(100,level*100)+'%';
 if(!lit)return;
 const blowing=level>BLOW_MIN/SCALE;
 const target=blowing?Math.min(1,level):0;lean+=(target-lean)*Math.min(1,dt*10);
 const ang=lean*(34+6*Math.sin(t/45)),sy=1-lean*.18+(blowing?.06*Math.sin(t/38):0);
 fl.style.transform='rotate('+ang+'deg) scaleY('+sy+')';rays.style.opacity=1-lean*.7;
 blowT=blowing?blowT+dt:Math.max(0,blowT-dt*1.5);
 if(blowT>=BLOW_TIME)snuff()}
function snuff(){lit=false;right.classList.add('out');fl.style.transform='';rays.style.opacity='';$('relight').hidden=false;$('hold').hidden=true;say('');confetti()}
function relight(){lit=true;blowT=0;lean=0;right.classList.remove('out');fl.style.transform='';rays.style.opacity='';$('relight').hidden=true;$('hold').hidden=false;clearConfetti()}
$('relight').onclick=()=>{relight();if(stream)say('Mic is on. Blow at the candle, or hold the button.')};
const hold=$('hold'),on=v=>{held=v;hold.classList.toggle('on',v)};
hold.addEventListener('pointerdown',e=>{e.preventDefault();on(true)});
['pointerup','pointerleave','pointercancel'].forEach(n=>hold.addEventListener(n,()=>on(false)));
addEventListener('keydown',e=>{if(e.code==='Space'&&isOpen){e.preventDefault();on(true)}});
addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();on(false)}});
// confetti
const cv=$('cf'),g=cv.getContext('2d');let P=[],cr=0;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}size();addEventListener('resize',size);
function confetti(){const col=['#c33c3c','#f6f0e2','#4f6b57','#e0b06a','#8e2a2a','#fff'],d=devicePixelRatio,r=right.getBoundingClientRect();
 for(let i=0;i<170;i++){const a=-Math.PI/2+(Math.random()-.5)*1.7,v=(5+Math.random()*10)*d;
  P.push({x:(r.left+r.width/2)*d,y:(r.top+r.height*.55)*d,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:(5+Math.random()*7)*d,h:(3+Math.random()*5)*d,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:col[i%col.length],life:1})}
 cancelAnimationFrame(cr);(function f(){g.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.22*d;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;if(p.y>cv.height*.7)p.life-=.02;
  g.save();g.globalAlpha=Math.max(0,p.life);g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()});
  P=P.filter(p=>p.life>0&&p.y<cv.height+40);if(P.length)cr=requestAnimationFrame(f);else g.clearRect(0,0,cv.width,cv.height)})()}
function clearConfetti(){P=[];cancelAnimationFrame(cr);g.clearRect(0,0,cv.width,cv.height)}
window.__t={open:openCard,level:v=>{manual=v}};
})();
</script></body></html>
